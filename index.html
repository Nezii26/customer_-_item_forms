    <center>
        <table>
            <tr>
                <td>
                    <div class="container">
                        <h3 id="lblCustomer">Customer Management</h3>
                        <label for="name">Name</label>
                        <input type="text" id="txtId" placeholder="Id"><br>
                        <input type="text" id="txtName" placeholder="Name"><br>
                        <input type="text" id="txtAge" placeholder="Age"><br>
                        <input type="text" id="txtAddres" placeholder="Address"><br>
                        <input type="text" id="txtSalary" placeholder="Salary"><br>

                        <br>
                        <input type="button" value="Add Customer" onclick="addCustomer()">

                        <h3 id="lblCustomer">View Customer</h3>
                        <table border="1" width="100%" id="tblcustomer">
                            <tr>
                                <th>Id</th>
                                <th>Name</th>
                                <th>Age</th>
                                <th>Address</th>
                                <th>Salary</th>
                            </tr>

                        </table>
                    </div>

                </td>
                <td>
                    <div class="container">
                        <h3 id="lblCustomer">Item Management</h3>
                        <input type="text" id="txtcode" placeholder="Item code"><br>
                        <input type="text" id="txtiName" placeholder="Item Name"><br>
                        <input type="text" id="txtprice" placeholder="Price"><br>
                        <input type="text" id="txtdate" placeholder="Exp.Date"><br>
                        <input type="text" id="txtContact" placeholder="Contact"><br>

                        <br>
                        <input type="button" value="Add Customer" onclick="addItem()">

                        <h3 id="lblCustomer">View Item</h3>
                        <table border="1" width="100%" id="tblItem">
                            <tr>
                                <th>Item code</th>
                                <th>Name</th>
                                <th>Price</th>
                                <th>Exp.Date</th>
                                <th>Contact</th>
                            </tr>

                        </table>
                    </div>

                </td>
            </tr>
        </table>
    </center>
